<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Segoe UI",Arial,sans-serif;
    background:#080b14;
    color:#f8fafc;
}

/* =====================================================
LOGIN
===================================================== */

#login{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(
            circle at center,
            #182233,
            #080b14 65%
        );
}

.login-box{
    width:430px;
    background:#111827;
    padding:45px;
    border-radius:15px;
    box-shadow:0 25px 70px #0009;
}

.logo{
    text-align:center;
    font-size:65px;
}

.login-title{
    text-align:center;
    font-size:25px;
    font-weight:bold;
}

.login-subtitle{
    text-align:center;
    color:#94a3b8;
    font-size:10px;
    margin-bottom:25px;
}

.login-box label{
    display:block;
    margin-top:10px;
}

.login-box input{
    width:100%;
    padding:13px;
    margin-top:5px;
    margin-bottom:12px;
    background:#0b1220;
    color:white;
    border:1px solid #263244;
    border-radius:7px;
}

.login-button{
    width:100%;
    margin-top:10px;
    padding:13px;
    border:0;
    border-radius:7px;
    background:#eab308;
    color:#111827;
    font-weight:bold;
    cursor:pointer;
}

.login-button:hover{
    background:#facc15;
}

.demo{
    text-align:center;
    color:#64748b;
    font-size:11px;
    margin-top:15px;
}


/* =====================================================
APP
===================================================== */

#app{
    display:none;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:250px;
    height:100vh;
    background:#0d121f;
    overflow-y:auto;
}

.sidebar-logo{
    text-align:center;
    font-size:42px;
    padding-top:20px;
}

.store-name{
    text-align:center;
    font-size:18px;
    font-weight:bold;
}

.role{
    text-align:center;
    color:#94a3b8;
    font-size:9px;
    margin:5px 0 20px;
}

.menu{
    width:100%;
    padding:13px 17px;
    background:transparent;
    border:0;
    color:#cbd5e1;
    text-align:left;
    cursor:pointer;
    font-size:14px;
    font-weight:bold;
}

.menu:hover{
    background:#182233;
    color:white;
}

.logout{
    color:#eab308;
}


/* =====================================================
CONTENIDO
===================================================== */

.content{
    margin-left:250px;
    padding:30px;
}

.title{
    font-size:30px;
    color:#eab308;
    font-weight:bold;
    margin-bottom:20px;
}

.subtitle{
    color:#94a3b8;
}

.card{
    background:#111827;
    padding:22px;
    border-radius:12px;
    margin-bottom:20px;
}

.cards{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(190px,1fr));
    gap:15px;
}

.stat{
    background:#111827;
    padding:20px;
    border-radius:10px;
}

.stat h2{
    margin:0;
    color:#eab308;
}

.stat p{
    color:#94a3b8;
}


/* =====================================================
BOTONES
===================================================== */

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

.btn{
    border:0;
    border-radius:7px;
    padding:11px 17px;
    font-weight:bold;
    cursor:pointer;
}

.primary{
    background:#eab308;
    color:#111827;
}

.pdf{
    background:#dc2626;
    color:white;
}

.excel{
    background:#16a34a;
    color:white;
}

.whatsapp{
    background:#25d366;
    color:white;
}

.blue{
    background:#2563eb;
    color:white;
}

.danger{
    background:#dc2626;
    color:white;
}


/* =====================================================
BUSCADOR
===================================================== */

.search{
    width:100%;
    padding:13px;
    background:#0b1220;
    color:white;
    border:1px solid #263244;
    border-radius:7px;
    margin-bottom:20px;
}


/* =====================================================
PRODUCTOS
===================================================== */

.product-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(210px,1fr));
    gap:18px;
}

.product{
    background:#111827;
    border-radius:12px;
    overflow:hidden;
    transition:.2s;
}

.product:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 30px #0007;
}

.product img{
    width:100%;
    height:220px;
    object-fit:cover;
    background:#1e293b;
}

.product-info{
    padding:15px;
}

.product-name{
    font-weight:bold;
    font-size:16px;
}

.product-category{
    color:#94a3b8;
    font-size:12px;
}

.price{
    color:#eab308;
    font-size:20px;
    font-weight:bold;
    margin:8px 0;
}

.stock{
    color:#94a3b8;
    font-size:12px;
}


/* =====================================================
TABLAS
===================================================== */

.table-container{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#0d121f;
    padding:12px;
    text-align:left;
}

td{
    padding:11px;
    border-bottom:1px solid #263244;
}

tr:hover{
    background:#182233;
}


/* =====================================================
CARRITO
===================================================== */

.cart{
    background:#0d121f;
    padding:20px;
    border-radius:10px;
    position:sticky;
    top:20px;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid #263244;
}

.total{
    font-size:25px;
    color:#eab308;
    font-weight:bold;
    margin-top:15px;
}


/* =====================================================
MODAL
===================================================== */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#0009;
    justify-content:center;
    align-items:center;
    z-index:1000;
}

.modal-box{
    width:450px;
    max-width:90%;
    background:#111827;
    padding:25px;
    border-radius:12px;
}

.modal-box input,
.modal-box select{
    width:100%;
    padding:11px;
    margin:7px 0 12px;
    background:#0b1220;
    color:white;
    border:1px solid #263244;
    border-radius:6px;
}


/* =====================================================
MOVIL
===================================================== */

@media(max-width:850px){

    .sidebar{
        width:190px;
    }

    .content{
        margin-left:190px;
        padding:15px;
    }

}

</style>

</head>

function agregarCarrito(id){

    let producto =
        productosData.find(
            p => p.id === id
        );


    if(!producto)
        return;


    if(producto.stock <= 0){

        alert(
            "Producto agotado."
        );

        return;

    }


    let existente =
        carrito.find(
            p => p.id === id
        );


    if(existente){

        if(existente.cantidad <
           producto.stock){

            existente.cantidad++;

        }

    }else{

        carrito.push({

            id:producto.id,

            nombre:producto.nombre,

            precio:producto.precio,

            cantidad:1

        });

    }


    mostrarCarrito();

}


function mostrarCarrito(){

    let contenedor =
        document.getElementById(
            "carrito"
        );


    if(!contenedor)
        return;


    if(!carrito.length){

        contenedor.innerHTML =
            "<p>Carrito vacío.</p>";

        document.getElementById("total")
            .textContent =
            "Total: Q0.00";

        return;

    }


    let total=0;


    contenedor.innerHTML =
        carrito.map(item=>{

            let subtotal =
                item.precio *
                item.cantidad;

            total += subtotal;


            return `

                <div class="cart-item">

                    <span>
                        ${item.nombre}
                        x${item.cantidad}
                    </span>

                    <span>
                        Q${subtotal.toFixed(2)}
                    </span>

                </div>

            `;

        }).join("");


    document.getElementById("total")
        .textContent =
        "Total: Q" + total.toFixed(2);

}


function finalizarVenta(){

    if(!carrito.length){

        alert(
            "El carrito está vacío."
        );

        return;

    }


    let total =
        carrito.reduce(
            (s,item) =>
                s +
                item.precio *
                item.cantidad,
            0
        );


    carrito.forEach(item=>{

        let producto =
            productosData.find(
                p => p.id === item.id
            );

        if(producto){

            producto.stock -=
                item.cantidad;

        }

    });


    ventasData.push({

        id:
            ventasData.length+1,

        fecha:
            new Date().toLocaleString(),

        productos:
            carrito.map(
                x => x.nombre
            ).join(", "),

        total:total

    });


    cajaData.ingresos += total;

    cajaData.efectivo += total;


    guardarTodo();


    carrito=[];


    alert(
        "Venta realizada correctamente.\n\n" +
        "Total: Q" +
        total.toFixed(2)
    );


    ventas();

}

function mostrarTabla(datos){

    let tabla =
        document.getElementById(
            "tablaGeneral"
        );


    if(!tabla)
        return;


    if(!datos.length){

        tabla.innerHTML =
            "<p>No hay datos.</p>";

        return;

    }


    let columnas =
        Object.keys(datos[0]);


    let html=`

        <table>

        <tr>

    `;


    columnas.forEach(c=>{

        html += `
            <th>${c}</th>
        `;

    });


    html += "</tr>";


    datos.forEach(fila=>{

        html += "<tr>";


        columnas.forEach(c=>{

            html += `
                <td>
                    ${fila[c] ?? ""}
                </td>
            `;

        });


        html += "</tr>";

    });


    html += "</table>";


    tabla.innerHTML=html;

/* =====================================================
PDF
===================================================== */

function crearPDF(tipo){

    let datos;


    if(tipo==="proveedores")
        datos=proveedoresData;

    if(tipo==="clientes")
        datos=clientesData;

    if(tipo==="empleados")
        datos=empleadosData;


    if(!datos.length){

        alert(
            "No hay información."
        );

        return;

    }


    const {
        jsPDF
    } = window.jspdf;


    let pdf =
        new jsPDF();


    pdf.setFontSize(18);

    pdf.text(
        "BOUTIQUE MODA & ESTILO",
        20,
        20
    );


    pdf.setFontSize(14);

    pdf.text(
        tipo.toUpperCase(),
        20,
        30
    );


    let columnas =
        Object.keys(
            datos[0]
        );


    let filas =
        datos.map(
            x =>
                columnas.map(
                    c =>
                        String(
                            x[c] ?? ""
                        )
                )
        );


    pdf.autoTable({

        head:[columnas],

        body:filas,

        startY:40

    });


    pdf.save(
        tipo+".pdf"
    );

}

function compartir(tipo){

    let numero =
        prompt(
            "Número de teléfono con código de país:\nEjemplo: 50255555555"
        );


    if(!numero)
        return;


    numero =
        numero
        .replace(/\+/g,"")
        .replace(/\s/g,"")
        .replace(/-/g,"")
        .replace(/\(/g,"")
        .replace(/\)/g,"");


    if(!/^\d+$/.test(numero)){

        alert(
            "Número inválido."
        );

        return;

    }


    let mensaje =
        "👗 BOUTIQUE MODA & ESTILO\n\n" +
        "Te comparto información de " +
        tipo +
        ".\n\n" +
        "Gracias por utilizar nuestro sistema.";


    let url =
        "https://wa.me/" +
        numero +
        "?text=" +
        encodeURIComponent(
            mensaje
        );


    window.open(
        url,
        "_blank"
    );

}

        </div>

        <div class="cards">

            <div class="stat">

                <h2>
                    Q${totalVentas.toFixed(2)}
                </h2>

                <p>
                    Ventas acumuladas
                </p>

            </div>

            <div class="stat">

                <h2>
                    ${ventasData.length}
                </h2>

                <p>
                    Número de ventas
                </p>

            </div>

        </div>

        <div class="card">

            <div class="actions">

                <button
                    class="btn pdf"
                    onclick="reportePDF()"
                >
                    📄 PDF
                </button>

                <button
                    class="btn excel"
                    onclick="reporteExcel()"
                >
                    📊 EXCEL
                </button>

            </div>

        </div>

    `;

}


function reporteExcel(){

    let hoja =
        XLSX.utils.json_to_sheet(
            ventasData
        );


    let libro =
        XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
        libro,
        hoja,
        "Ventas"
    );


    XLSX.writeFile(
        libro,
        "reporte_ventas.xlsx"
    );

}


function reportePDF(){

    const {
        jsPDF
    } = window.jspdf;


    let pdf =
        new jsPDF();


    pdf.text(
        "BOUTIQUE MODA & ESTILO",
        20,
        20
    );


    pdf.text(
        "REPORTE DE VENTAS",
        20,
        30
    );


    let filas =
        ventasData.map(
            v => [
                v.id,
                v.fecha,
                v.productos,
                "Q"+v.total.toFixed(2)
            ]
        );


    pdf.autoTable({

        head:[
            [
                "ID",
                "Fecha",
                "Productos",
                "Total"
            ]
        ],

        body:filas,

        startY:40

    });


    pdf.save(
        "reporte_ventas.pdf"
    );

}
